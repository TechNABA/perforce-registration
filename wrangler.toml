# Configurazione di riferimento del Worker.
#
# Il deploy si fa dalla dashboard Cloudflare (Workers & Pages → Edit code),
# questo file documenta binding e secret attesi da worker.js.
#
# Con wrangler installato: `wrangler deploy`
# I secret NON vanno mai scritti qui:
#   wrangler secret put ADMIN_TOKEN
#   wrangler secret put DISCORD_WEBHOOK

name = "perforce-registration"
main = "worker.js"
compatibility_date = "2026-07-01"

# Namespace KV con i record utente.
# Sostituire l'id con quello reale dopo aver creato il namespace:
#   Workers & Pages → KV → Create namespace → nome "perforce-users"
[[kv_namespaces]]
binding = "USERS"
id = "SOSTITUIRE_CON_ID_NAMESPACE"

# Secret (da impostare come Secret, non come Variable in chiaro):
#   ADMIN_TOKEN      autentica /import, /export, /status, /purge
#   DISCORD_WEBHOOK  notifica le nuove registrazioni
